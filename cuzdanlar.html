<!DOCTYPE html>
<html class="light" lang="tr">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Hediyemo - Kullanılabilir Cüzdanlar</title>

  <link rel="stylesheet" href="./tailwind-config.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./shared-guest.css" />

</head>
<body class="guest-page guest-wallet-page bg-background text-on-surface">
  <header class="guest-wallet-header sticky top-0 z-50 bg-white/80 shadow-[0_12px_40px_rgba(26,28,29,0.06)] backdrop-blur-xl dark:bg-zinc-900/80">
    <div class="mx-auto flex w-full max-w-4xl items-center justify-between gap-6 px-4 py-4 sm:px-6">
      <a href="./index.html" class="inline-flex min-w-0 items-center">
        <img
          src="https://mivento.hediyemo.com/templates/img/logo.png?v=2.0.10_1777286381"
          alt="Hediyemo"
          class="h-12 w-auto max-w-[210px] object-contain sm:h-14 sm:max-w-none"
        />
      </a>
      <a href="./login.html" class="flex shrink-0 cursor-pointer flex-col items-center justify-center gap-1 rounded-xl px-3 py-2 text-primary transition-colors duration-200 hover:bg-primary-container/5 active:scale-95 md:flex-row md:gap-2 md:px-4 md:py-2.5">
        <span class="material-symbols-outlined text-2xl md:text-[22px]">logout</span>
        <span class="font-headline text-xs font-bold tracking-normal whitespace-nowrap md:text-sm">Çıkış Yap</span>
      </a>
    </div>
  </header>

  <main class="mx-auto max-w-4xl px-6 pb-16 pt-12">
    <section class="mb-10">
      <h1 class="whitespace-nowrap text-3xl font-bold leading-tight tracking-normal text-on-surface md:text-4xl">Kullanılabilir Cüzdanlar</h1>
      <p class="mt-2 max-w-2xl text-sm font-medium leading-6 text-zinc-500">Puan kullanmak istediğiniz cüzdanı seçiniz.</p>
    </section>

    <section class="grid grid-cols-1 items-stretch gap-6 md:grid-cols-2">
      <article class="group relative overflow-hidden rounded-xl bg-surface-container-lowest p-6 shadow-[0_12px_40px_rgba(26,28,29,0.06)] transition-all duration-300 hover:-translate-y-1 md:p-7">
        <div class="absolute -right-12 -top-12 h-32 w-32 rounded-xl bg-primary-container/5 blur-3xl transition-colors group-hover:bg-primary-container/10"></div>
        <div class="relative z-10">
          <div class="flex items-center justify-between gap-4">
            <span class="font-headline text-xl font-medium tracking-normal text-zinc-900">Sompo Sigorta</span>
            <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-surface-container-low">
              <span class="material-symbols-outlined text-[1.75rem] text-primary">account_balance_wallet</span>
            </div>
          </div>
          <div class="mt-6 flex items-baseline gap-2 rounded-xl bg-surface-container-low px-5 py-4 text-4xl font-medium tracking-normal text-on-surface">
            <span>1.250,00</span>
            <span class="text-lg font-medium tracking-normal text-on-surface">Puan</span>
          </div>
        </div>
        <button class="relative z-10 mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-primary-container px-6 py-3 font-bold text-on-primary shadow-lg shadow-primary-container/20 transition-transform duration-200 active:scale-95">
          <span class="material-symbols-outlined text-xl">redeem</span>
          Puan Kullan
        </button>
      </article>

      <article class="group relative overflow-hidden rounded-xl bg-surface-container-lowest p-6 shadow-[0_12px_40px_rgba(26,28,29,0.06)] transition-all duration-300 hover:-translate-y-1 md:p-7">
        <div class="absolute -bottom-12 -left-12 h-32 w-32 rounded-xl bg-tertiary/5 blur-3xl transition-colors group-hover:bg-tertiary/10"></div>
        <div class="relative z-10">
          <div class="flex items-center justify-between gap-4">
            <span class="font-headline text-xl font-medium tracking-normal text-zinc-900">Sompo Coin</span>
            <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-surface-container-low text-primary">
              <span class="material-symbols-outlined text-[1.75rem]">wallet</span>
            </div>
          </div>
          <div class="mt-6 flex items-baseline gap-2 rounded-xl bg-surface-container-low px-5 py-4 text-4xl font-medium tracking-normal text-on-surface">
            <span>45.000</span>
            <span class="text-lg font-medium tracking-normal text-on-surface">Puan</span>
          </div>
        </div>
        <button class="relative z-10 mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-primary-container px-6 py-3 font-bold text-on-primary shadow-lg shadow-primary-container/20 transition-transform duration-200 active:scale-95">
          <span class="material-symbols-outlined text-xl">shopping_basket</span>
          Puan Kullan
        </button>
      </article>
    </section>
  </main>
  <script src="./page-js/cuzdanlar.js"></script>
  <script src="./shared.js"></script>
</body>
</html>
