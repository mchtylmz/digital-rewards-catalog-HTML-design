<!DOCTYPE html>
<html class="light" lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş Yap | Hediyemo - The Digital Curator</title>
  <link rel="stylesheet" href="./tailwind-config.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./shared-guest.css" />

  
</head>
<body class="guest-page guest-auth-page bg-background text-on-background flex min-h-screen flex-col selection:bg-primary-container/20 selection:text-primary">
  <main class="guest-auth-shell flex min-h-screen flex-grow flex-col md:flex-row">
    <section class="relative flex min-h-screen w-full flex-col justify-center overflow-hidden bg-surface-container-lowest px-8 py-12 md:min-h-0 md:w-[45%] md:px-16 lg:px-24">
      <div class="pointer-events-none absolute -left-24 top-16 h-60 w-60 rounded-full bg-emerald-100/80"></div>
      <div class="pointer-events-none absolute bottom-[-4.75rem] left-1/3 h-44 w-44 rounded-full bg-indigo-100/90"></div>
      <div class="pointer-events-none absolute right-10 top-20 h-12 w-12 rounded-full border border-zinc-300/80"></div>
      <div class="pointer-events-none absolute right-4 top-36 h-24 w-24 rounded-full border-[4px] border-zinc-100"></div>

      <div class="relative z-10 mx-auto w-full max-w-md">
        <div class="mb-12">
          <img
            src="https://mivento.hediyemo.com/templates/img/logo.png?v=2.0.10_1777286381"
            alt="Hediyemo"
            class="h-16 w-auto object-contain sm:h-20"
          />
        </div>

        <form class="space-y-6">
          <div class="space-y-1.5">
            <label class="ml-1 block text-sm font-semibold text-on-surface-variant" for="username">Kullanıcı Adı</label>
            <div class="relative">
              <input
                id="username"
                type="text"
                value="ramazan.guler"
                placeholder="Kullanıcı adınızı yazın"
                class="w-full rounded-xl border-none bg-surface-container-low px-5 py-4 pr-14 text-on-surface outline-none transition-all placeholder:text-on-surface-variant/50"
              />
              <span class="guest-input-icon guest-user-icon material-symbols-outlined pointer-events-none absolute right-4 text-[22px] text-zinc-400">account_circle</span>
            </div>
          </div>

          <div class="space-y-1.5">
            <label class="ml-1 block text-sm font-semibold text-on-surface-variant" for="password">Parola</label>
            <div class="relative">
              <input
                id="password"
                type="password"
                value="12345678"
                placeholder="••••••••"
                class="w-full rounded-xl border-none bg-surface-container-low px-5 py-4 pr-14 text-on-surface outline-none transition-all placeholder:text-on-surface-variant/50"
              />
              <button id="togglePasswordButton" type="button" class="guest-input-icon absolute right-4 text-zinc-400 transition-colors hover:text-primary" aria-label="Parolayı göster">
                <span id="togglePasswordIcon" class="material-symbols-outlined">visibility_off</span>
              </button>
            </div>
            <div class="px-1 pt-1">
              <a class="text-sm font-medium text-primary transition-colors hover:text-secondary" href="#">Parolamı Unuttum</a>
            </div>
          </div>

          <button class="flex w-full items-center justify-center gap-3 rounded-xl bg-primary-container py-4 font-bold text-on-primary shadow-[0_8px_24px_rgba(227,6,19,0.2)] transition-all duration-200 hover:scale-[1.01] hover:shadow-[0_12px_32px_rgba(227,6,19,0.3)] active:scale-[0.98]" type="submit">
            <span>Giriş Yap</span>
            <span class="material-symbols-outlined text-[1.15rem]">login</span>
          </button>
        </form>
      </div>
    </section>

    <section class="relative hidden min-h-[34rem] w-full overflow-hidden bg-primary-container md:block md:w-[55%]">
      <div class="absolute inset-0">
        <img
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuCRC44xCN_sEEDu4H9FPZfUJZEmNLxnN9iCx_kRYj1pJ5i_nIlsEj3WeUuXZ-Yt4CtO9EnyOUxlQBAFNKQIl1sCac2eMCr14_UB7pbsojKHt_qwduovPIbLnirIukyXBk8KsdbNKjzETXexdl0WmiWfVtzyBz0JuPnaBHs8Qq2PntO-p8_sfHk-gwSH5SjtKPpBd07PjhLgXtHmd65M1HoMwYh3zLWonLQ-sBs8usMTcXa3vMm0erH2ztBV5yhB5RMCnv_vz1Orutty"
          alt="Luxury Gift"
          class="h-full w-full object-cover"
        />
        <div class="absolute inset-0 bg-gradient-to-tr from-primary/90 via-primary-container/40 to-transparent"></div>
      </div>

      <div class="relative flex h-full flex-col justify-end p-8 sm:p-10 md:p-16 lg:p-24">
        <div class="max-w-xl">
          <div class="mb-6 inline-flex rounded-full border border-white/20 bg-white/10 px-4 py-1.5 backdrop-blur-md">
            <span class="text-xs font-bold uppercase tracking-widest text-white">Dijital Küratör</span>
          </div>
          <h2 class="mb-6 text-[2.65rem] font-black leading-tight tracking-tighter text-white sm:text-[3.2rem] md:text-5xl lg:text-7xl">
            Hediye Vermenin En Zarif Hali.
          </h2>
          <p class="mb-10 max-w-lg text-lg font-medium leading-relaxed text-white/80 md:text-xl">
            Sevdiklerinize özel anlar yaşatın. Özenle seçilmiş dijital hediye kartları ve deneyimler Hediyemo ile parmaklarınızın ucunda.
          </p>
          <div class="flex flex-wrap gap-3">
            <div class="flex items-center gap-2 rounded-full bg-white/10 px-4 py-2 text-sm font-semibold text-white backdrop-blur-xl">
              <span class="material-symbols-outlined text-base">verified</span>
              <span>Anında Teslimat</span>
            </div>
            <div class="flex items-center gap-2 rounded-full bg-white/10 px-4 py-2 text-sm font-semibold text-white backdrop-blur-xl">
              <span class="material-symbols-outlined text-base">card_giftcard</span>
              <span>500+ Marka</span>
            </div>
          </div>
        </div>
      </div>

      <div class="absolute right-24 top-24 h-64 w-64 rounded-full bg-secondary-container/20 blur-[100px]"></div>
      <div class="absolute bottom-24 left-24 h-96 w-96 rounded-full bg-tertiary-container/10 blur-[120px]"></div>
    </section>
  </main>

  
  <script src="./page-js/login.js"></script>
  <script src="./shared.js"></script>
</body>
</html>
